services:
  db:
    image: postgres:16
    container_name: jobtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobtrack
      POSTGRES_USER: jobtrack
      POSTGRES_PASSWORD: jobtrack_dev_password
    ports:
      - "5432:5432"
    volumes:
      - jobtrack_pgdata:/var/lib/postgresql/data

volumes:
  jobtrack_pgdata:
